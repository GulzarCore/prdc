
name: DevOps Lab CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Run tests and checks
        run: |
          chmod +x scripts/test.sh scripts/check.sh
          ./scripts/check.sh

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  repository-security:
    name: Scan repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Scan for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  build-scan-publish:
    name: Build, scan and publish images
    runs-on: ubuntu-24.04
    needs:
      - validate
      - repository-security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image names
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=ghcr.io/${REPO}" >> "$GITHUB_ENV"

      - name: Build frontend image
        run: |
          docker build \
            --tag "$IMAGE_PREFIX-frontend:$GITHUB_SHA" \
            --file frontend/Dockerfile \
            frontend

      - name: Build backend image
        run: |
          docker build \
            --tag "$IMAGE_PREFIX-backend:$GITHUB_SHA" \
            --file backend/Dockerfile \
            .

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_PREFIX-frontend:$GITHUB_SHA"

      - name: Publish backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_PREFIX-backend:$GITHUB_SHA"
